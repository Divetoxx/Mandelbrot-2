name: C++ Mandelbrot Build 

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-gmp
          update: true

      - name: Compile Windows Versions (AVX2 and SSE3)
        shell: msys2 {0}
        run: |
          if [ -f resource.rc ]; then
            windres resource.rc -o resource.o
            RESOURCE_OBJ="resource.o"
          else
            RESOURCE_OBJ=""
          fi

          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_AVX2.exe -mavx2 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -lgdi32 -luser32 -ldwmapi -Wl,--end-group -mwindows
          strip Mandelbrot_AVX2.exe

          g++ -O3 main.cpp $RESOURCE_OBJ -o Mandelbrot_SSE3.exe -msse3 -static -static-libgcc -static-libstdc++ -Wl,--start-group -lmpfr -lgmp -lwinpthread -lgdi32 -luser32 -ldwmapi -Wl,--end-group -mwindows
          strip Mandelbrot_SSE3.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot GUI: Visualizer with Perturbation Theory and Bilinear approximation ${{ github.ref_name }}"
          body: |
            ### Available versions (Fully Static Exe):
            * **Mandelbrot_AVX2.exe** — Maximum speed. For modern processors (4th generation Intel Core+ / AMD Ryzen+).
            * **Mandelbrot_SSE3.exe** — Compatible version. For older processors (including **AMD Phenom II**).
 
            ### Features:
            * **High-Precision Reference:** The 1000-bit reference trajectory is computed exactly once per zoom layer.
            * **Hardware-Native Performance:** Blazing-fast math for millions of pixels utilizing hardware-native double registers.
            * **Dynamic Reference Relocalization:** Professional *Reset to Zero* implementation ensuring flawless orbit re-basing without precision loss.
            * **Bilinear approximation:** The calculation can be performed significantly faster by using bilinear approximation.
            * **True 2x2 SSAA:** Pristine, anti-aliased image quality with 4 independent samples per pixel.
            * **Pure C++11 Multi-threading:** High-speed parallel computing built directly into the language standard. Scales transparently across architectures—delivering flawless 100% CPU utilization whether running on a 4-core laptop or a 128-core high-performance server without external dependencies.
            * **DwmFlush Synchronization:** Stutter-free, hardware-aligned frame presentation synchronized with Windows DWM.
            * **Dynamic Palette Rotation:** Classic, ultra-smooth fractal color-cycling effects with zero performance overhead.



          files: |
            Mandelbrot_AVX2.exe
            Mandelbrot_SSE3.exe
