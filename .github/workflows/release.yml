name: C++ Mandelbrot Build 

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-mpfr
            mingw-w64-ucrt-x86_64-gmp

      - name: Compile Windows Versions (AVX2 and SSE3)
        shell: msys2 {0}
        run: |
          if [ -f resource.rc ]; then
            windres resource.rc -o resource.o
            RESOURCE_OBJ="resource.o"
          else
            RESOURCE_OBJ=""
          fi

          # Шаг 1: Компилируем исходный код в объектный файл. Флаг -fopenmp здесь ОБЯЗАТЕЛЕН, 
          # чтобы компилятор правильно обработал ваши параллельные циклы #pragma omp.
          g++ -O3 -c main.cpp -o main_avx2.o -mavx2 -fopenmp
          
          # Шаг 2: Линкуем финальный .exe БЕЗ флага -fopenmp! GCC больше скрытно не подставит -lgomp.
          # Чтобы OpenMP работал динамически через стандартную Windows DLL, мы передаем флаг потоков напрямую.
          g++ main_avx2.o $RESOURCE_OBJ -o Mandelbrot_AVX2.exe -static-libgcc -static-libstdc++ -Wl,-Bstatic -lmpfr -lgmp -Wl,-Bdynamic -lwinpthread -lgdi32 -luser32 -ldwmapi -mwindows
          strip Mandelbrot_AVX2.exe

          # Повторяем ту же беспроигрышную схему для версии SSE3
          g++ -O3 -c main.cpp -o main_sse3.o -msse3 -fopenmp
          g++ main_sse3.o $RESOURCE_OBJ -o Mandelbrot_SSE3.exe -static-libgcc -static-libstdc++ -Wl,-Bstatic -lmpfr -lgmp -Wl,-Bdynamic -lwinpthread -lgdi32 -luser32 -ldwmapi -mwindows
          strip Mandelbrot_SSE3.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot GUI: Visualizer with Perturbation Theory and Bilinear approximation ${{ github.ref_name }}"
          body: |
            ### Available versions:
            * **Mandelbrot_AVX2.exe** — Maximum speed. For modern processors (4th generation Intel Core+ / AMD Ryzen+).
            * **Mandelbrot_SSE3.exe** — Compatible version. For older processors (including **AMD Phenom II**).
 
            ### Features:
            * **High-Precision Reference:** The 1000-bit reference trajectory is computed exactly once per zoom layer.
            * **Hardware-Native Performance:** Blazing-fast math for millions of pixels utilizing hardware-native double registers.
            * When using double-precision floating-point numbers (on the order of 1e-15), perturbation theory only allows you to zoom down to the **1e-308 level—no further.**
            * **Dynamic Reference Relocalization:** Professional *Reset to Zero* implementation ensuring flawless orbit re-basing without precision loss.
            * **Bilinear approximation:** The calculation can be performed significantly faster by using bilinear approximation.
            * **True 2x2 SSAA:** Pristine, anti-aliased image quality with 4 independent samples per pixel.
            * **OpenMP Multi-threading:** High-speed parallel computing to maximize CPU utilization.
            * **DwmFlush Synchronization:** Stutter-free, hardware-aligned frame presentation synchronized with Windows DWM.
            * **Dynamic Palette Rotation:** Classic, ultra-smooth fractal color-cycling effects with zero performance overhead.

          files: |
            Mandelbrot_AVX2.exe
            Mandelbrot_SSE3.exe