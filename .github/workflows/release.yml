name: Create Release Windows Only

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
          update: true

      - name: Compile Windows Version
        shell: msys2 {0}
        run: |
          windres resource.rc -o resource.o
          g++ -O3 main.cpp resource.o -o Mandelbrot-2.exe \
          -lgdi32 -luser32 -ldwmapi -fopenmp -static -mwindows \
          -D__USE_MINGW_ANSI_STDIO=1
          strip Mandelbrot-2.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot set. 32-bit. 60 FPS. 80-bit. OpenMP. Supersampling 2x2. Color rotation ${{ github.ref_name }}"
          body: |
            ## Mandelbrot set. 32-bit. 60 FPS. 80-bit. OpenMP. Supersampling 2x2. Color rotation 
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>
            <video src="" controls width="900"></video>

            - True 32-bit BGRA
            - Synchronization with DwmFlush
            - High-Precision Rendering (80-bit)
            - Multi-threaded performance (OpenMP)
            - True SSAA 2x2 (4 independent samples per pixel) direct RGB-space integration
            - The Red, Green, and Blue channels are calculated using sine and cosine waves
          files: Mandelbrot-2.exe
